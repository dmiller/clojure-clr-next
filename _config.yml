# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ClojureCLR - Next!
email: dmiller2718@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  A project to rewrite the ClojureCLR engine.
baseurl: "/clojure-clr-next" # the subpath of your site, e.g. /blog
url: "https://dmiller.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: dmiller2718
github_username:  dmiller

# Build settings
theme: minima
plugins:
  - jekyll-feed

show_excerpts: true

# Pages in the top navigation bar, in order.
header_pages:
  - projects/next.md
  - projects/clr.md
  - series.md
  - topics.md
  - archive.md
  - about.markdown

sass:
  sourcemap: never   # Jekyll 4 would otherwise publish assets/main.css.map
  style: compressed  # as the old github-pages build did

# Post URLs are frozen at their original form. Jekyll's default permalink
# includes :categories, so without this, changing a post's categories would
# change its public URL. Use tags or other front matter for organizing posts.
permalink: /general/:year/:month/:day/:title:output_ext

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - docs/planning/   # working notes for site changes, not for publication
  - src/             # project source; nothing on the site links into it
  # The github-pages build drops its default exclusions once this list is set,
  # so restate them.
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Default exclusions:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
